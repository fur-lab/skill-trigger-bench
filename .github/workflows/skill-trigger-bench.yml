name: Skill trigger checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skill-trigger-bench
        run: python -m pip install git+https://github.com/fur-lab/skill-trigger-bench.git
      - name: Check trigger boundaries
        run: skill-trigger-bench run examples/csv-summary/SKILL.md --cases examples/csv-summary/trigger-cases.json
